services:
  # FastAPI Backend
  - type: web
    name: knightmind-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r services/api/requirements.txt && pip install -r services/ingest/requirements.txt"
    startCommand: "cd services/api && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
