services:
  # FastAPI Backend
  - type: web
    name: knightmind-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -e ."
    startCommand: "uvicorn services.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
