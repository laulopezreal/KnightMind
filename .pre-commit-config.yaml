repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Lint only. FORMATTING IS BLACK'S -- see the black hook below and
  # `uv run black --check .` in ci-backend.yaml. A `ruff-format` hook used to
  # sit here, which meant pre-commit reformatted 13 files into a style CI then
  # rejected: anyone who ran the hooks broke their own build.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]

  # Pinned to the range pyproject declares, so the hook and CI cannot drift.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, json, markdown]
