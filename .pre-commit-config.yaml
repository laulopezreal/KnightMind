repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Lint only. FORMATTING IS BLACK'S -- see the black hook below and
  # `uv run black --check .` in ci-backend.yaml. A `ruff-format` hook used to
  # sit here, which meant pre-commit reformatted 13 files into a style CI then
  # rejected: anyone who ran the hooks broke their own build.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # `ruff-check`, not `ruff`: the bare id is upstream's legacy alias
      # ("ruff (legacy alias)" in their hooks file). It still resolves at
      # v0.16.3, but the rev bump that outlives it fails every `pre-commit run`
      # with "Hook `ruff` is not present in repository".
      - id: ruff-check
        args: [ --fix, --exit-non-zero-on-fix ]

  # Pinned to the exact version the lock resolves. Nothing enforces that this
  # rev and pyproject agree -- no workflow runs pre-commit -- so a
  # `uv lock --upgrade` that moves CI to 26.6.x while this stays at 26.5.1
  # recreates the hook-formats-what-CI-rejects trap on the version axis. Hence
  # black~=26.5.1 in pyproject: patch-only, same policy as ruff and mypy, and
  # for the strongest reason of the three, since black is the one that rewrites
  # files.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  # NO PRETTIER HOOK, deliberately. The frontend has never been
  # prettier-formatted: prettier is not a dependency in apps/web/package.json,
  # there is no config file, and ci-frontend.yaml runs `npm run lint` (eslint)
  # and nothing else. Running prettier here rewrote 225 files -- 189 even when
  # configured to match the codebase's single quotes -- into a style nothing
  # enforces, so installing the hooks and committing produced an enormous
  # unrelated diff.
  #
  # Adopting prettier is a fine idea and a separate decision: it needs a config,
  # a devDependency, a CI check, and one deliberate ~200-file reformat. Add the
  # hook back as part of that, not before it.
