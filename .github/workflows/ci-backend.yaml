name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'services/api/**'
      - 'services/ingest/**'
      - 'scripts/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/ci-backend.yaml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'services/api/**'
      - 'services/ingest/**'
      - 'scripts/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/ci-backend.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 only, matching the production image (python:3.13-slim, see
        # Dockerfile) and requires-python in pyproject. This job used to test
        # 3.11 exclusively -- a version nothing deploys and no developer here
        # uses -- while production's own interpreter went unverified. Keep this
        # list, requires-python, and the Dockerfile base image in step.
        python-version: ["3.13"]

    # The application is Postgres-only and so is the suite. There is no SQLite
    # fallback to fall back to any more, which is the point: the tests run on
    # the database production runs, or they do not run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knightmind
          POSTGRES_PASSWORD: knightmind
          POSTGRES_DB: knightmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knightmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      KNIGHTMIND_TEST_DATABASE_URL: postgresql+psycopg://knightmind:knightmind@localhost:5432/knightmind_test

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # `pip install -e ".[dev]"` re-resolved every dependency on every run while
    # uv.lock sat in the repo unused, so CI tested versions no developer had.
    # It resolved FastAPI 0.141 against a lock pinning 0.128 -- and those two
    # expose sub-routers differently. --locked fails if the lock has drifted
    # from pyproject.toml rather than quietly resolving around it.
    - name: Install locked dependencies
      run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

    - name: Lint
      run: |
        uv run ruff check .
        uv run black --check .

    - name: Run Tests
      working-directory: ./services/api
      run: uv run pytest

  # Migration job: proves the chain applies on a real Postgres from zero, that
  # the migrated schema still matches the models, and runs the PG-only
  # concurrency tests. The `test` job above already runs the whole suite on
  # Postgres, so this one is deliberately narrow -- it exists for the migration
  # checks, which need a database the suite has NOT rebuilt from the models.
  #
  # Selection is by MARKER (`-m postgres`), never by filename: this job used to
  # run `test_jobs.py -k postgres`, so the four review/session concurrency tests
  # added later in test_review_session_integration.py never ran here at all.
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knightmind
          POSTGRES_PASSWORD: knightmind
          POSTGRES_DB: knightmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knightmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://knightmind:knightmind@localhost:5432/knightmind_test
      KNIGHTMIND_TEST_DATABASE_URL: postgresql+psycopg://knightmind:knightmind@localhost:5432/knightmind_test
      KNIGHTMIND_TEST_POSTGRES_URL: postgresql+psycopg://knightmind:knightmind@localhost:5432/knightmind_test

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # 3.13 to match the production image: this job is the one that touches a
    # real Postgres and the migration chain, so it should run the interpreter
    # production runs.
    - name: Install locked dependencies
      run: uv sync --locked --extra dev --python 3.13

    - name: Apply migrations on Postgres (from zero)
      working-directory: ./services/api
      run: |
        uv run alembic upgrade head

    # Guards the gap between the two schema sources of truth: the tests build
    # their schema with Base.metadata.create_all(), production applies the
    # migration chain, and nothing compared them. A model change with no
    # migration used to pass every job here and fail on the first prod query.
    - name: Check models and migrations agree
      working-directory: ./services/api
      run: |
        uv run alembic check

    - name: Run Postgres integration tests
      working-directory: ./services/api
      run: |
        uv run pytest -m postgres -v
