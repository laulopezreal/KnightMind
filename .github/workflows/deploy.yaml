# ============================================================================
# KnightMind – Deploy to Hetzner VPS
# ============================================================================
# Triggers on push to main. SSHs into the server, pulls latest code, rebuilds,
# and restarts.
#
# CI is gated by the `ci-gate` job below, which waits for this commit's checks
# and refuses to deploy over a red one. It used to say "enforced by branch
# protection" -- which was false: neither main nor dev is protected and there
# are no rulesets, so every check was advisory while this workflow deployed
# regardless.
#
# Required GitHub Secrets:
#   DEPLOY_HOST       – Server tailnet IP or MagicDNS name (reached over the tailnet)
#   DEPLOY_USER       – SSH user (e.g., root or deploy)
#   DEPLOY_SSH_KEY    – Private SSH key for authentication
#   DEPLOY_APP_DIR    – App directory on server (e.g., /opt/knightmind)
#   TS_OAUTH_CLIENT_ID – Tailscale OAuth client id (tag:ci), to join the tailnet in CI
#   TS_OAUTH_SECRET    – Tailscale OAuth secret (tag:ci)
# ============================================================================

name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger
    inputs:
      skip_ci_gate:
        description: "Break-glass: deploy without waiting for CI. Say why in the run notes."
        type: boolean
        default: false

# Prevent concurrent deployments
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The real gate. Waits for every other check run on this commit to finish,
  # then refuses to deploy if any of them failed.
  #
  # Branch protection would be the stronger control -- it stops the merge rather
  # than the deploy -- and this job does not replace it. It exists because the
  # repo has none, so without it a red `test (3.13)` reached production
  # unimpeded.
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit: the repo is public today so an unauthenticated read works, but
    # the default workflow permission here is `read` and this would 403 on the
    # day the repo goes private.
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for this commit's checks, and refuse a red one
        if: github.event.inputs.skip_ci_gate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # Every job in THIS workflow is a check run on this commit, so all of
          # them must be excluded. `ci-gate` is obvious -- without it the gate
          # waits on its own completion. `deploy` is the one that bites: a
          # previous attempt's `deploy: failure` is still attached to the SHA,
          # so "Re-run all jobs" after a transient SSH failure would find it and
          # refuse forever, leaving break-glass as the only way out. That turns
          # a false block into routinely deploying with the gate switched off.
          SELF_JOBS: "ci-gate|deploy"
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 25 * 60 ))
          # A commit can legitimately have no checks at all: every workflow here
          # is paths-filtered, so a docs-only push to main runs none of them.
          # Waiting the full deadline for checks that will never register would
          # turn that into a 25-minute red deploy, so give registration a short
          # grace period and treat a genuinely empty set as nothing to verify.
          grace=$(( SECONDS + 3 * 60 ))
          while :; do
            # A single transient 5xx must not kill a 25-minute gate -- during a
            # GitHub incident, which is exactly when this matters, `set -e`
            # would abort on the first blip of ~75 calls. Retry, and only give
            # up if the API is unreachable three times running.
            #
            # per_page=100 because the default is 30 and the script would
            # silently evaluate a subset; total_count is asserted against what
            # was actually returned rather than assumed.
            payload=""
            for attempt in 1 2 3; do
              if payload=$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" 2>/dev/null); then
                break
              fi
              echo "check-runs query failed (attempt ${attempt}); retrying in 10s."
              payload=""
              sleep 10
            done
            if [ -z "${payload}" ]; then
              echo "::error::Could not read check runs for ${SHA} after 3 attempts."
              exit 1
            fi

            total=$(printf '%s' "${payload}" | jq -r '.total_count')
            runs=$(printf '%s' "${payload}" |
                   jq -r --arg self "${SELF_JOBS}" '
                     .check_runs[] | select(.name | test("^(" + $self + ")$") | not) |
                     [.name, .status, (.conclusion // "-")] | @tsv')
            returned=$(printf '%s' "${payload}" | jq -r '.check_runs | length')
            if [ "${total}" -gt "${returned}" ]; then
              echo "::error::${total} check runs exist but only ${returned} were read; refusing to judge a subset."
              exit 1
            fi

            if [ -z "${runs}" ]; then
              if [ "${SECONDS}" -ge "${grace}" ]; then
                echo "::warning::No checks registered on ${SHA} after 3 minutes."
                echo "Nothing to verify -- every workflow is paths-filtered and none matched."
                exit 0
              fi
              echo "No other check runs are registered on ${SHA} yet; waiting."
            else
              printf '%s\n' "${runs}" | awk -F'\t' '{printf "  %-24s %-12s %s\n", $1, $2, $3}'
            fi

            pending=$(printf '%s\n' "${runs}" | awk -F'\t' '$2 != "completed"' | wc -l | tr -d ' ')
            if [ "${pending}" -eq 0 ] && [ -n "${runs}" ]; then
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::Timed out waiting for checks on ${SHA}. Not deploying."
              exit 1
            fi
            sleep 20
          done

          # Anything that is not a pass blocks: `failure`, `cancelled`,
          # `timed_out`, and `action_required` all mean nobody confirmed this
          # commit is good. `skipped` and `neutral` are fine -- a paths filter
          # legitimately skips backend CI for a frontend-only change.
          bad=$(printf '%s\n' "${runs}" |
                awk -F'\t' '$3 != "success" && $3 != "skipped" && $3 != "neutral"')
          if [ -n "${bad}" ]; then
            echo "::error::Refusing to deploy ${SHA}; these checks did not pass:"
            printf '%s\n' "${bad}" | awk -F'\t' '{printf "  %s: %s\n", $1, $3}'
            exit 1
          fi
          echo "All checks on ${SHA} passed. Proceeding."

      - name: Record a break-glass deploy
        if: github.event.inputs.skip_ci_gate == 'true'
        run: |
          echo "::warning::CI gate SKIPPED by manual dispatch. Deploying ${{ github.sha }} unverified."

  deploy:
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      # GitHub-hosted runners are not on the tailnet, and the server's public
      # :22 is closed. Join the tailnet first so the SSH deploy below can reach
      # DEPLOY_HOST over its tailnet address.
      - name: Connect to tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # (script_stop was removed in ssh-action v1; set -e below does the job)
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            cd "${APP_DIR}"

            # Compose only auto-loads a file literally named ".env" for
            # ${POSTGRES_*} interpolation; this project uses .env.docker,
            # so every compose invocation must pass --env-file explicitly.
            COMPOSE="docker compose --env-file ${APP_DIR}/.env.docker"

            echo "--- Checking out the exact commit CI verified ---"
            # NOT `reset --hard origin/main`. The gate verifies ${{ github.sha }};
            # resetting to whatever origin/main points at by the time the deploy
            # runs can ship a DIFFERENT, unverified commit. The old 4-second
            # echo made the two effectively identical, but a gate that waits up
            # to 25 minutes opens a real window: merge X, gate waits on X, merge
            # Y (red) lands meanwhile, and this line would deploy Y with X's
            # green checks. Deploy exactly what was gated.
            SHA="${{ github.sha }}"
            git fetch origin main
            # Refuse a SHA that is not on main. workflow_dispatch has no branch
            # restriction, so dispatching from `dev` would otherwise gate dev's
            # checks and then deploy main's code.
            if ! git merge-base --is-ancestor "${SHA}" origin/main; then
              echo "Refusing to deploy ${SHA}: it is not an ancestor of origin/main."
              exit 1
            fi
            git fetch origin "${SHA}"
            git reset --hard "${SHA}"
            echo "Deploying ${SHA} ($(git log -1 --format=%s))"

            echo "--- Building new image ---"
            # No service argument. The worker is a second container from the
            # same image, and `build api` never touched it -- so every deploy
            # after the first left it running the previous deploy's code while
            # the schema and the API moved on. Silently: a stale worker keeps
            # beating, so /ops/health stays green and this gate passes.
            ${COMPOSE} build

            echo "--- Running migrations (new image, before switching traffic) ---"
            # One-off container on the freshly built image; set -e aborts the
            # deploy on failure, leaving the old containers serving traffic.
            # No --no-deps: compose run must start db (and wait for its
            # healthcheck via depends_on) so deploys self-heal from a stopped
            # stack (fresh server, or after systemctl stop knightmind-api).
            ${COMPOSE} run --rm api alembic -c services/api/alembic.ini upgrade head

            echo "--- Restarting with new code ---"
            ${COMPOSE} up -d

            echo "--- Health check (host published port = the real ingress path) ---"
            # Probe 127.0.0.1:8000 on the HOST, not inside the container. This is
            # the exact path Caddy proxies to for public traffic, so a green here
            # proves real ingress works. An in-container probe would pass even
            # when host->container port forwarding is broken -- which took
            # api.guessme.world down on 2026-07-25 while the container stayed
            # healthy internally. Use 127.0.0.1 explicitly (not 'localhost',
            # which resolves to ::1/IPv6 first while the publish is IPv4-only)
            # and a per-attempt timeout so a wedged socket fails fast.
            ok=0
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -m 5 -w "%{http_code}" http://127.0.0.1:8000/ops/health || true)
              if [ "${code}" = "200" ]; then
                echo "Health check passed (attempt ${i}, HTTP 200)"
                ok=1
                break
              fi
              echo "Health check attempt ${i}: HTTP ${code:-000}; retrying in 3s..."
              sleep 3
            done
            if [ "${ok}" -ne 1 ]; then
              echo "Health check FAILED: api not reachable on host 127.0.0.1:8000 (the path Caddy uses for public ingress)."
              echo "The container can be healthy internally while host->container forwarding is broken; check the docker port publish / iptables FORWARD rule for the api bridge."
              ${COMPOSE} logs --tail=50 api
              exit 1
            fi

      - name: Notify success
        if: success()
        run: echo "Deployed successfully to production."

      - name: Notify failure
        if: failure()
        run: echo "::error::Deployment failed. Check the logs above."
