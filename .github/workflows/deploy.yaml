# ============================================================================
# KnightMind – Deploy to Hetzner VPS
# ============================================================================
# Triggers on push to main (after CI passes).
# SSHs into the server, pulls latest code, rebuilds, and restarts.
#
# Required GitHub Secrets:
#   DEPLOY_HOST       – Server tailnet IP or MagicDNS name (reached over the tailnet)
#   DEPLOY_USER       – SSH user (e.g., root or deploy)
#   DEPLOY_SSH_KEY    – Private SSH key for authentication
#   DEPLOY_APP_DIR    – App directory on server (e.g., /opt/knightmind)
#   TS_OAUTH_CLIENT_ID – Tailscale OAuth client id (tag:ci), to join the tailnet in CI
#   TS_OAUTH_SECRET    – Tailscale OAuth secret (tag:ci)
# ============================================================================

name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

# Prevent concurrent deployments
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate: only deploy if CI passes
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        run: echo "Deploy triggered — CI checks enforced by branch protection."

  deploy:
    needs: ci-check
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      # GitHub-hosted runners are not on the tailnet, and the server's public
      # :22 is closed. Join the tailnet first so the SSH deploy below can reach
      # DEPLOY_HOST over its tailnet address.
      - name: Connect to tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # (script_stop was removed in ssh-action v1; set -e below does the job)
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            cd "${APP_DIR}"

            # Compose only auto-loads a file literally named ".env" for
            # ${POSTGRES_*} interpolation; this project uses .env.docker,
            # so every compose invocation must pass --env-file explicitly.
            COMPOSE="docker compose --env-file ${APP_DIR}/.env.docker"

            echo "--- Pulling latest code ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- Building new image ---"
            ${COMPOSE} build api

            echo "--- Running migrations (new image, before switching traffic) ---"
            # One-off container on the freshly built image; set -e aborts the
            # deploy on failure, leaving the old containers serving traffic.
            # No --no-deps: compose run must start db (and wait for its
            # healthcheck via depends_on) so deploys self-heal from a stopped
            # stack (fresh server, or after systemctl stop knightmind-api).
            ${COMPOSE} run --rm api alembic -c services/api/alembic.ini upgrade head

            echo "--- Restarting with new code ---"
            ${COMPOSE} up -d

            echo "--- Health check (host published port = the real ingress path) ---"
            # Probe 127.0.0.1:8000 on the HOST, not inside the container. This is
            # the exact path Caddy proxies to for public traffic, so a green here
            # proves real ingress works. An in-container probe would pass even
            # when host->container port forwarding is broken -- which took
            # api.guessme.world down on 2026-07-25 while the container stayed
            # healthy internally. Use 127.0.0.1 explicitly (not 'localhost',
            # which resolves to ::1/IPv6 first while the publish is IPv4-only)
            # and a per-attempt timeout so a wedged socket fails fast.
            ok=0
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -m 5 -w "%{http_code}" http://127.0.0.1:8000/ops/health || true)
              if [ "${code}" = "200" ]; then
                echo "Health check passed (attempt ${i}, HTTP 200)"
                ok=1
                break
              fi
              echo "Health check attempt ${i}: HTTP ${code:-000}; retrying in 3s..."
              sleep 3
            done
            if [ "${ok}" -ne 1 ]; then
              echo "Health check FAILED: api not reachable on host 127.0.0.1:8000 (the path Caddy uses for public ingress)."
              echo "The container can be healthy internally while host->container forwarding is broken; check the docker port publish / iptables FORWARD rule for the api bridge."
              ${COMPOSE} logs --tail=50 api
              exit 1
            fi

      - name: Notify success
        if: success()
        run: echo "Deployed successfully to production."

      - name: Notify failure
        if: failure()
        run: echo "::error::Deployment failed. Check the logs above."
