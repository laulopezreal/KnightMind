[build]
  command = "npm run build"
  publish = "dist"

# Handle SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy API requests to your backend
[[redirects]]
  from = "/api/*"
  to = "https://knightmind-api.onrender.com/:splat"
  status = 200
  force = true
