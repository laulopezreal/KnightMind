<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>KnightMind | Personal Chess Intelligence Platform</title>
    <meta

      content="KnightMind is a personal chess intelligence platform for game analysis, personalized puzzle training, and progress tracking using FastAPI, React, and Stockfish."
    />
    <meta
      name="keywords"
      content="chess analysis, chess training, personalized chess puzzles, stockfish, fastapi, react, chess dashboard"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://knightmind.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KnightMind" />
    <meta property="og:title" content="KnightMind | Personal Chess Intelligence Platform" />
    <meta
      property="og:description"
      content="Analyze your games, train with personalized puzzles, and track your chess improvement over time."
    />
    <meta property="og:url" content="https://knightmind.dev/" />
    <meta property="og:image" content="https://knightmind.dev/favicon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KnightMind | Personal Chess Intelligence Platform" />
    <meta
      name="twitter:description"
      content="Personal chess intelligence: game analysis, custom puzzle generation, and improvement insights."
    />
    <meta name="twitter:image" content="https://knightmind.dev/favicon.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "KnightMind",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Web",
        "description": "Personal chess intelligence platform for game analysis, training, and insights.",
        "url": "https://knightmind.dev/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Apply theme class before first paint to prevent flash of wrong theme -->
    <script>
      (function() {
        const STORAGE_KEY = 'knightmind:theme';
        let stored = null;
        try { stored = localStorage.getItem(STORAGE_KEY); } catch(e) {}
        const theme = (stored === 'night' || stored === 'day')
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
        document.body.className = theme;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
