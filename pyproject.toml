[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "scripts*"]

[project]
name = "knightmind"
version = "0.1.0"
description = "Personal Chess Intelligence Platform"
# Matches the production image (python:3.13-slim, see Dockerfile) and the only
# version CI exercises. The previous ">=3.11" floor was never verified anywhere
# once CI moved to 3.13, so it claimed support nothing tested.
requires-python = ">=3.13"
# All deps below are installed together. Rough mapping: API (services/api) — alembic, anthropic, chess, fastapi, pydantic*, psycopg, python-dotenv, sqlalchemy, stockfish, uvicorn. Ingest (services/ingest) — httpx, truststore. Some are shared.
dependencies = [
    "alembic>=1.13.0",
    "anthropic>=0.100.0",
    "chess>=1.10.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "passlib[argon2]>=1.7.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg[binary]>=3.1.18",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "stockfish>=3.28.0",
    "truststore",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
start-backend = "scripts.start_backend:main"
kill-backends = "scripts.kill_backends:main"

[project.optional-dependencies]
dev = [
    "black~=26.5.1",
    "flake8",
    # Three components on purpose, like ruff~=0.16.3: `~=1.19` would still
    # admit 1.20 and 1.30. mypy does not use SemVer -- new checks land in minor
    # releases by upstream policy (1.20's better narrowing can even mark code
    # unreachable and stop checking it), so a minor bump can move this baseline
    # with only a one-line lock diff to review. Patch-only.
    "mypy~=1.19.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Same policy, same reason. ruff is pre-1.0 and uses the minor as its
    # breaking slot, so new lint rules land in 0.16 rather than in 0.15.x.
    # Crossing a minor is a deliberate baseline move: 0.15.20 -> 0.16.3 was
    # taken after confirming `ruff check .` still passes clean on this tree.
    # Patch bumps inside 0.16 stay automatic.
    "ruff~=0.16.3",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "services/api",
    "services/ingest",
]
python_files = ["test_*.py", "*_test.py"]
markers = [
    # Needs a real, disposable Postgres (KNIGHTMIND_TEST_POSTGRES_URL). Skipped
    # automatically when unset -- see pytest_collection_modifyitems in the root
    # conftest.py. CI runs these with `pytest -m postgres`.
    "postgres: requires a disposable Postgres instance",
]

[tool.mypy]
python_version = "3.13"
# Third-party stubs are inconsistent across this dependency set (chess, stockfish,
# anthropic); missing ones would drown the signal we actually want.
ignore_missing_imports = true
# Check the bodies of unannotated functions too. Off by default, which meant
# the gate skipped the body of any `def` with no annotations at all -- 92% of
# production defs were annotated so little was lost there, but only 2.5% of
# test defs were, so most test bodies were never looked at. "no issues found
# in 119 source files" counted files it opened, not code it checked.
check_untyped_defs = true
# Migrations are immutable history. Their alembic op signatures drift between
# versions and re-typing an applied migration is never worth it.
exclude = ["services/api/alembic/versions/"]

# Every module under services/api is enforced. There is no `ignore_errors`
# list any more: it began at 12 modules and 120 suppressed errors when the gate
# went in, and is now empty.
#
# What the gate covers, measured rather than estimated. mypy prints "checked
# 119 source files": that is the services/api crawl, with the 32 migrations
# under alembic/versions excluded above and genuinely never parsed (a syntax
# error in one does not fail the run). But it ALSO follows imports and enforces
# 7 repo files that count never mentions -- root conftest.py, three under
# scripts/, and services/ingest/chesscom.py. 126 repo files are read, all
# enforced.
#
# Two limits remain:
#   - `ignore_missing_imports` above also hides typo'd or undeclared imports.
#   - `check_untyped_defs` checks BODIES, not signatures. A call to an
#     unannotated helper still returns Any and erases everything downstream of
#     it: 80% of defs here have no return annotation, and 97% of test defs are
#     unannotated entirely. "Every module is enforced" is a claim about
#     modules, not about every expression inside them.
#
# If a future change cannot be typed cleanly, add a narrow `# type: ignore[code]`
# at the line with a reason, rather than reinstating a per-module blackout --
# `ignore_errors` silences NEW bugs in a module as completely as old ones,
# which is what made the original list worth deleting rather than living with.

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E", "W", "F", "I", "B"]
ignore = [
    "E501", # line length is owned by black; long strings/URLs may exceed 88 chars
    "B008", # FastAPI's `Depends(...)` in argument defaults is idiomatic
]

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# main.py must call load_dotenv() and patch sys.path before project imports
"services/api/main.py" = ["E402"]
# standard alembic pattern: config/path setup precedes imports
"services/api/alembic/env.py" = ["E402"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10
