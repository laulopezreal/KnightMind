[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "scripts*"]

[project]
name = "knightmind"
version = "0.1.0"
description = "Personal Chess Intelligence Platform"
# Matches the production image (python:3.13-slim, see Dockerfile) and the only
# version CI exercises. The previous ">=3.11" floor was never verified anywhere
# once CI moved to 3.13, so it claimed support nothing tested.
requires-python = ">=3.13"
# All deps below are installed together. Rough mapping: API (services/api) — alembic, anthropic, chess, fastapi, pydantic*, psycopg, python-dotenv, sqlalchemy, stockfish, uvicorn. Ingest (services/ingest) — httpx, truststore. Some are shared.
dependencies = [
    "alembic>=1.13.0",
    "anthropic>=0.100.0",
    "chess>=1.10.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "passlib[argon2]>=1.7.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg[binary]>=3.1.18",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "stockfish>=3.28.0",
    "truststore",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
start-backend = "scripts.start_backend:main"
kill-backends = "scripts.kill_backends:main"

[project.optional-dependencies]
dev = [
    "black~=26.5",
    "flake8",
    # Three components on purpose, like ruff~=0.15.20: `~=1.19` would still
    # admit 1.20 and 1.30. mypy does not use SemVer -- new checks land in minor
    # releases by upstream policy (1.20's better narrowing can even mark code
    # unreachable and stop checking it), so a minor bump can move this baseline
    # with only a one-line lock diff to review. Patch-only.
    "mypy~=1.19.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff~=0.15.20",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "services/api",
    "services/ingest",
]
python_files = ["test_*.py", "*_test.py"]
markers = [
    # Needs a real, disposable Postgres (KNIGHTMIND_TEST_POSTGRES_URL). Skipped
    # automatically when unset -- see pytest_collection_modifyitems in the root
    # conftest.py. CI runs these with `pytest -m postgres`.
    "postgres: requires a disposable Postgres instance",
]

[tool.mypy]
python_version = "3.13"
# Third-party stubs are inconsistent across this dependency set (chess, stockfish,
# anthropic); missing ones would drown the signal we actually want.
ignore_missing_imports = true
# Migrations are immutable history. Their alembic op signatures drift between
# versions and re-typing an applied migration is never worth it.
exclude = ["services/api/alembic/versions/"]

# Modules carrying pre-existing type debt, checked when this was turned on.
# This is a to-fix list, not an exemption list.
#
# What the gate actually covers, measured rather than estimated. mypy prints
# "checked 119 source files": that is the services/api crawl, with the 32
# migrations under alembic/versions excluded above and genuinely never parsed
# (a syntax error in one does not fail the run). But it ALSO follows imports
# and enforces 7 repo files that count never mentions -- root conftest.py,
# three under scripts/, and services/ingest/chesscom.py. 126 repo files are
# read in total.
#
# The 10 listed below are silenced *entirely* -- `ignore_errors` is a
# per-module blackout, not a per-error suppression, so a new bug written into
# one of these is as invisible as the old ones. 116 files are enforced.
#
# Two limits worth stating, because "no issues found in 119 source files" reads
# stronger than it is:
#   - `check_untyped_defs` is off (mypy's default), so the body of any function
#     with no annotations at all is skipped wholesale. Production code is 92%
#     annotated, so little is lost there; test files are 2.5%, so most test
#     bodies are not checked. Flipping it today costs 1 production error and
#     185 in tests; 119 production errors once this debt list comes off. Worth
#     doing, as its own change.
#   - `ignore_missing_imports` above also hides typo'd or undeclared imports.
#
# The list is shrinking, not sitting there: it began at 12 modules and 120
# errors. puzzles/generator.py left in #367 and ratings.py -- which alone
# carried 75 of the errors -- leaves here, so 10 modules and 37 errors remain.
#
# puzzles/generator.py used to head this list as the one entry that was NOT
# cosmetic: its `str | None` reaching a `str` parameter was a live crash path.
# chess.Board.is_game_over() is true for insufficient material, the 75-move
# rule AND fivefold repetition while legal moves remain, so the position before
# a played move CAN be terminal and best_move_uci CAN be None -- and the None
# aborted the whole generation batch via chess.Move.from_uci(None). Fixed and
# enforced in #367 (a guard in the ply loop, plus a regression test), which is
# why it is no longer listed. The 10 that remain are the cosmetic ones.
[[tool.mypy.overrides]]
module = [
    "services.api.ai.client",
    "services.api.analysis.scheduler_eval",
    "services.api.benchmarks.fixtures",
    "services.api.benchmarks.runner",
    "services.api.dashboard",
    "services.api.diagnosis.job",
    "services.api.main",
    "services.api.openings.tree_builder",
    "services.api.ops",
    "services.api.puzzles_routes",
]
ignore_errors = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E", "W", "F", "I", "B"]
ignore = [
    "E501", # line length is owned by black; long strings/URLs may exceed 88 chars
    "B008", # FastAPI's `Depends(...)` in argument defaults is idiomatic
]

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# main.py must call load_dotenv() and patch sys.path before project imports
"services/api/main.py" = ["E402"]
# standard alembic pattern: config/path setup precedes imports
"services/api/alembic/env.py" = ["E402"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10
