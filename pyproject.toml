[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "scripts*"]

[project]
name = "knightmind"
version = "0.1.0"
description = "Personal Chess Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "chess>=1.10.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg[binary]>=3.1.18",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "stockfish>=3.28.0",
    "truststore",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
start-backend = "scripts.start_backend:main"
kill-backends = "scripts.kill_backends:main"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "mypy",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "services/api",
    "services/ingest",
]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E", "W", "F", "I", "B"]
ignore = []

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10
